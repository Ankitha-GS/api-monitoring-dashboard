global:
  scrape_interval: 5s        # short on purpose so the demo reacts quickly (use 15s-30s in production)
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 1) Application metrics exposed by FastAPI at /metrics
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # 2) Synthetic uptime probe of /health (availability, response time, status code)
  - job_name: blackbox-health
    metrics_path: /probe
    params: { module: [http_health] }
    static_configs:
      - targets: ["http://api:8000/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # 3) Synthetic probe of an authenticated endpoint (valid key) -> detects auth/key breakage end-to-end
  - job_name: blackbox-users
    metrics_path: /probe
    params: { module: [http_users_authenticated] }
    static_configs:
      - targets: ["http://api:8000/users"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
